name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Server ────────────────────────────────────────────────────────────────
  server:
    name: Server — lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studium_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studium_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      BCRYPT_SALT_ROUNDS: "10"
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studium_test

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  # ── Client ────────────────────────────────────────────────────────────────
  client:
    name: Client — lint · typecheck · test · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  # ── E2E (optional, runs when label "e2e" is applied) ─────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: [server, client]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studium_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Setup database
        run: npx prisma migrate deploy && npx prisma db seed
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studium_dev

      - name: Start server
        run: npm run dev &
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studium_dev
          JWT_SECRET: e2e-jwt-secret-must-be-at-least-32-chars
          NODE_ENV: development

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Start client
        run: npm run dev &
        working-directory: client

      - name: Wait for services
        run: npx wait-on http://localhost:5000/health http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          E2E_ENABLED: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
